<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Signo</title>
    <link rel="stylesheet" href="./src/css/Signo.css">
</head>
<body id="calcuSig">
    <form id="formSig">
        <h1>CALCULADORA DE SIGNO</h1>
        <br><br/>

        <label for="dia">informe o seu dia. </label>
        <input type="text" name="dia" id="dia"/>
        <br/>

        <label for="mes">Informe o seu mes. </label>
        <input type="text" name="mes" id="mes"/>
        <br/>
        
        <label for="ano">Informe o seu ano. </label>
        <input type="text" name="ano" id="ano"/>
        <br/><br>
        
        <label for="mesnas">Seu mes de nascimento foi: </label>
        <input type="text" name="mesnas" id="mesnas" readonly/>
        <br/>
        
        <label for="ano">O dia da semana foi: </label>
        <input type="text" name="ano" id="txtsema" readonly/>
        
        
        <tr>
            <td class="maior">Sob o Signo de:</td>
            <input type="text" name="sig " id="sig" readonly/>
            <td class="menor"><img src="./src/assets/images/vazio.png" name="signo"/></td>
        </tr>
        <br><br>
        
        <label for="ano">Sua idade é: </label>
        <input type="text" name="Idade" id="Idade" readonly/>


        <input type="button" value="Exibir" onclick="Calcular()">
        <input type="reset" value="C" onclick="limpar()">

    </form>
    
    <Script src="./src/js/Signo.js"></Script>
</body>
</html>
